<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Mesa de Som</title>
<style>
:root{color-scheme:dark;--bg:#0e0f12;--panel:#181a20;--line:#2c3039;--tx:#e8eaf0;--mut:#8b93a3;--acc:#ff9f1c;--grn:#38e07b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,system-ui,Roboto,Arial,sans-serif;-webkit-user-select:none;user-select:none}
main{max-width:480px;margin:0 auto;padding:12px}
h1{font-size:15px;letter-spacing:3px;text-transform:uppercase;color:var(--mut);text-align:center;margin:6px 0 12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.disp{background:#050607;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-family:ui-monospace,Menlo,monospace;color:var(--grn);min-height:58px}
.disp small{color:var(--mut);display:block}
.disp b{font-size:17px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:flex;gap:8px;margin-top:10px}
input[type=tel]{flex:1;min-width:0;font-size:24px;text-align:center;background:#050607;color:var(--acc);border:1px solid var(--line);border-radius:10px;padding:10px;font-family:ui-monospace,Menlo,monospace;-webkit-user-select:text;user-select:text}
button,.btn{background:#242833;color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:15px;font-weight:600;cursor:pointer;text-align:center}
button:active,.btn:active{background:#323847}
.go{background:var(--acc);color:#111;border-color:var(--acc)}
.full{width:100%;margin-top:10px;display:block}
.bar{height:6px;background:#050607;border-radius:3px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--grn)}
.mix{display:flex;justify-content:space-around;padding:14px 4px}
.ch{display:flex;flex-direction:column;align-items:center;width:23%}
.fw{display:flex;align-items:stretch;gap:4px;height:210px}
.scale{position:relative;width:26px;font-size:10px;color:var(--mut);font-family:ui-monospace,Menlo,monospace}
.scale span{position:absolute;right:0;transform:translateY(-50%);white-space:nowrap}
.scale span:after{content:"";display:inline-block;width:5px;height:1px;background:var(--mut);margin-left:3px;vertical-align:middle}
.fader{position:relative;width:44px;touch-action:none;cursor:pointer}
.fader:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:6px;margin-left:-3px;background:#050607;border:1px solid var(--line);border-radius:3px}
.knob{position:absolute;left:0;width:44px;height:26px;margin-top:-13px;border-radius:5px;background:linear-gradient(#5a6070,#2b2f3a 50%,#444a59);border:1px solid #6b7285;box-shadow:0 3px 6px #000a}
.knob:after{content:"";position:absolute;left:5px;right:5px;top:50%;height:2px;background:var(--acc);margin-top:-1px}
.lbl{margin-top:8px;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--mut)}
.val{font-family:ui-monospace,Menlo,monospace;font-size:13px;color:var(--acc)}
.list{max-height:200px;overflow:auto}
.it{display:flex;gap:10px;padding:10px 6px;border-bottom:1px solid var(--line);font-size:14px}
.it.on{color:var(--grn)}
.it span:first-child{color:var(--mut);width:34px;text-align:right;font-family:ui-monospace,Menlo,monospace}
.it span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick{position:relative;overflow:hidden}
.pick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:0;cursor:pointer}
.hint{color:var(--mut);font-size:13px;text-align:center;padding:8px}
.it{-webkit-touch-callout:none}
.m5 .ch{width:24%}.m5 .scale{width:22px;font-size:9px}.m5 .fader,.m5 .knob{width:34px}.m5 .lbl{font-size:10px;letter-spacing:0}.m5 .val{font-size:11px}
.mic{margin-top:6px}
#ov{display:none;position:fixed;inset:0;background:#000b;z-index:9;align-items:flex-end;justify-content:center;padding:12px}
#ov.on{display:flex}
#ov .sh{width:100%;max-width:480px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
#ov .sh p{margin:0 0 4px;color:var(--mut);font-size:13px}
#ov .sh b{display:block;margin-bottom:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#ov button{width:100%;margin-top:8px}
#ov .rm{background:#5a1d1d;border-color:#8a2c2c;color:#ffd5d5}
</style>
</head>
<body>
<main>
<h1>Mesa de Som</h1>
<noscript><div class="card hint">Este visualizador bloqueou o JavaScript. Abra o arquivo no Chrome (Android) ou no Safari (iPhone).</div></noscript>

<div class="card">
  <div class="disp"><small id="n">FAIXA --</small><b id="t">Carregue suas músicas</b></div>
  <div class="bar"><i id="p"></i></div>
  <div class="row">
    <input id="num" type="tel" inputmode="numeric" pattern="[0-9]*" placeholder="Nº" maxlength="4">
    <button class="go" id="go">▶ TOCAR</button>
  </div>
  <div class="row">
    <button id="prev" style="flex:1">⏮</button>
    <button id="pp" style="flex:1">⏯</button>
    <button id="next" style="flex:1">⏭</button>
  </div>
  <div class="btn full pick">📂 Carregar músicas do aparelho
    <input id="file" type="file" accept="audio/*,.mp3,.m4a,.aac,.wav,.ogg,.flac" multiple>
  </div>
</div>

<div class="card mix" id="mix"></div>

<div class="card mic"><button class="go full" id="micb" style="margin-top:0">🎤 LIGAR MICROFONE</button>
<div class="hint" id="mst">Use fone ou afaste o microfone da caixa de som para não dar apito.</div>
<div class="mix m5" id="mic"></div></div>

<div class="card list" id="list"><div class="hint">Nenhuma música carregada</div></div>
</main>

<div id="ov"><div class="sh"><p>Música selecionada</p><b id="ovn"></b>
<button class="rm" id="ov1">🗑 Remover esta música</button>
<button class="rm" id="ovall">🗑 Remover todas as músicas</button>
<button id="ovc">Cancelar</button></div></div>

<script>
(function(){
var au=document.createElement("audio");au.preload="auto";au.setAttribute("playsinline","");document.body.appendChild(au);
var tracks=[],cur=-1,ctx,nodes={};
var $=function(i){return document.getElementById(i)};

function setup(){
  if(ctx)return;
  var AC=window.AudioContext||window.webkitAudioContext;
  ctx=new AC({latencyHint:0});
  var src=ctx.createMediaElementSource(au);
  var b=ctx.createBiquadFilter();b.type="lowshelf";b.frequency.value=150;
  var m=ctx.createBiquadFilter();m.type="peaking";m.frequency.value=1000;m.Q.value=0.8;
  var h=ctx.createBiquadFilter();h.type="highshelf";h.frequency.value=5000;
  var g=ctx.createGain();g.gain.value=vol;
  src.connect(b);b.connect(m);m.connect(h);h.connect(g);g.connect(ctx.destination);
  nodes={b:b,m:m,h:h,g:g};
  b.gain.value=eq.b;m.gain.value=eq.m;h.gain.value=eq.h;
}
var eq={b:0,m:0,h:0},vol=0.7;

function fader(host,o){
  var w=document.createElement("div");w.className="fw";
  var sc=document.createElement("div");sc.className="scale";
  var f=document.createElement("div");f.className="fader";
  var k=document.createElement("div");k.className="knob";f.appendChild(k);
  o.marks.forEach(function(v){
    var s=document.createElement("span");
    s.textContent=o.mark(v);
    s.style.top=((o.max-v)/(o.max-o.min)*100)+"%";
    sc.appendChild(s);
  });
  w.appendChild(sc);w.appendChild(f);host.appendChild(w);
  var val=document.createElement("div");val.className="val";
  var lb=document.createElement("div");lb.className="lbl";lb.textContent=o.name;
  host.appendChild(val);host.appendChild(lb);
  function set(v){
    v=Math.max(o.min,Math.min(o.max,v));
    if(o.snap&&Math.abs(v-o.snap)<0.8)v=o.snap;
    k.style.top=((o.max-v)/(o.max-o.min)*100)+"%";
    val.textContent=o.fmt(v);o.on(v);
  }
  function mv(e){
    var r=f.getBoundingClientRect();
    var y=Math.max(0,Math.min(1,(e.clientY-r.top)/r.height));
    set(o.max-y*(o.max-o.min));
  }
  f.addEventListener("pointerdown",function(e){f.setPointerCapture(e.pointerId);mv(e);f.onpointermove=mv});
  f.addEventListener("pointerup",function(){f.onpointermove=null});
  f.addEventListener("pointercancel",function(){f.onpointermove=null});
  set(o.start);
}

var mix=$("mix");
function ch(h){var d=document.createElement("div");d.className="ch";(h||mix).appendChild(d);return d}
var dbm=function(v){return(v>0?"+":"")+v};
var dbf=function(v){return(v>0?"+":"")+v.toFixed(1)+" dB"};
[["b","GRAVE"],["m","MÉDIO"],["h","AGUDO"]].forEach(function(x){
  fader(ch(),{name:x[1],min:-12,max:12,start:0,snap:0,marks:[12,6,0,-6,-12],mark:dbm,fmt:dbf,
    on:function(v){eq[x[0]]=v;if(nodes[x[0]])nodes[x[0]].gain.value=v}});
});
fader(ch(),{name:"VOLUME",min:0,max:1,start:0.7,marks:[1,0.75,0.5,0.25,0],
  mark:function(v){return Math.round(v*100)},fmt:function(v){return Math.round(v*100)+"%"},
  on:function(v){vol=v;if(nodes.g)nodes.g.gain.value=v;else au.volume=1}});

var mic={vol:1,pitch:0,b:0,h:0,echo:0,on:false},mn={};
function F(t,f){var b=ctx.createBiquadFilter();b.type=t;b.frequency.value=f;return b}
function applyMic(){
  if(!mn.out)return;
  mn.out.gain.value=mic.vol;mn.lo.gain.value=mic.b;mn.hi.gain.value=mic.h;
  var P=0.06,r=Math.pow(2,mic.pitch/12),D=(1-r)*P,on=mic.pitch!==0;
  mn.dry.gain.value=on?0:1;mn.wet.gain.value=on?1:0;
  mn.mg.forEach(function(x){x.m.gain.value=D;x.d.delayTime.value=D<0?-D:0});
}
function build(st){
  var P=0.06,len=Math.round(ctx.sampleRate*P),s=ctx.createMediaStreamSource(st);
  var hp=F("highpass",80),lo=F("lowshelf",200),hi=F("highshelf",4000);
  var sum=ctx.createGain(),dry=ctx.createGain(),wet=ctx.createGain(),out=ctx.createGain();
  s.connect(hp);hp.connect(lo);lo.connect(hi);hi.connect(dry);dry.connect(sum);wet.connect(sum);
  var rb=ctx.createBuffer(1,len,ctx.sampleRate),fb=ctx.createBuffer(1,len,ctx.sampleRate);
  var r=rb.getChannelData(0),f=fb.getChannelData(0);
  for(var i=0;i<len;i++){r[i]=i/len;f[i]=Math.pow(Math.sin(Math.PI*i/len),2)}
  var mg=[],srcs=[];
  [0,P/2].forEach(function(off){
    var d=ctx.createDelay(0.5),g=ctx.createGain(),m=ctx.createGain(),rs=ctx.createBufferSource(),fs=ctx.createBufferSource();
    g.gain.value=0;
    rs.buffer=rb;rs.loop=true;rs.connect(m);m.connect(d.delayTime);
    fs.buffer=fb;fs.loop=true;fs.connect(g.gain);
    hi.connect(d);d.connect(g);g.connect(wet);
    rs.start(0,off);fs.start(0,off);
    mg.push({m:m,d:d});srcs.push(rs,fs);
  });
  sum.connect(out);
  out.connect(ctx.destination);
  mn={out:out,lo:lo,hi:hi,dry:dry,wet:wet,mg:mg,st:st,srcs:srcs};
  applyMic();
}
function stopMic(){
  if(mn.st)mn.st.getTracks().forEach(function(t){t.stop()});
  if(mn.srcs)mn.srcs.forEach(function(x){try{x.stop()}catch(e){}});
  if(mn.out)mn.out.disconnect();
  mn={};mic.on=false;$("micb").textContent="🎤 LIGAR MICROFONE";$("micb").className="go full";
}
$("micb").onclick=function(){
  if(mic.on){stopMic();$("mst").textContent="Microfone desligado.";return}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){$("mst").textContent="Este navegador não liberou o microfone. Abra no Chrome ou no Safari.";return}
  setup();if(ctx.state==="suspended")ctx.resume();
  navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:false,autoGainControl:false,channelCount:1,latency:0}}).then(function(st){
    build(st);mic.on=true;$("micb").textContent="⏹ DESLIGAR MICROFONE";$("micb").className="full";
    $("mst").textContent="Microfone ligado. Use fone para evitar apito.";
  }).catch(function(){$("mst").textContent="Microfone bloqueado. Permita o acesso ao microfone e abra no Chrome ou no Safari."});
};
var mm=$("mic"),pc=function(v){return Math.round(v*100)+"%"},db=function(v){return(v>0?"+":"")+Math.round(v)};
fader(ch(mm),{name:"MIC",min:0,max:1.5,start:1,marks:[1.5,1,0.5,0],mark:function(v){return Math.round(v*100)},fmt:pc,on:function(v){mic.vol=v;applyMic()}});
fader(ch(mm),{name:"TOM",min:-12,max:12,start:0,snap:0,marks:[12,6,0,-6,-12],mark:dbm,fmt:function(v){return db(v)+" st"},on:function(v){mic.pitch=Math.round(v);applyMic()}});
fader(ch(mm),{name:"GRAVE",min:-12,max:12,start:0,snap:0,marks:[12,6,0,-6,-12],mark:dbm,fmt:function(v){return db(v)+" dB"},on:function(v){mic.b=v;applyMic()}});
fader(ch(mm),{name:"AGUDO",min:-12,max:12,start:0,snap:0,marks:[12,6,0,-6,-12],mark:dbm,fmt:function(v){return db(v)+" dB"},on:function(v){mic.h=v;applyMic()}});

function render(){
  var l=$("list");l.innerHTML="";
  if(!tracks.length){l.innerHTML='<div class="hint">Nenhuma música carregada</div>';return}
  tracks.forEach(function(t,i){
    var d=document.createElement("div");d.className="it"+(i===cur?" on":"");
    d.innerHTML="<span>"+(i+1)+"</span><span></span>";
    d.lastChild.textContent=t.name;
    var tm=null,lp=false;
    d.addEventListener("pointerdown",function(){lp=false;clearTimeout(tm);tm=setTimeout(function(){lp=true;if(navigator.vibrate)navigator.vibrate(30);ask(i)},550)});
    ["pointerup","pointerleave","pointercancel"].forEach(function(ev){d.addEventListener(ev,function(){clearTimeout(tm)})});
    d.addEventListener("click",function(){if(!lp)play(i)});
    d.addEventListener("contextmenu",function(e){e.preventDefault()});
    l.appendChild(d);
  });
}
var sel=-1;
function ask(i){sel=i;$("ovn").textContent=(i+1)+" - "+tracks[i].name;$("ov").className="on"}
function closeMenu(){$("ov").className=""}
function stopIf(all,i){
  if(all||i===cur){au.pause();au.removeAttribute("src");try{au.load()}catch(e){}cur=-1;$("p").style.width="0";$("t").textContent="Digite o número e toque"}
  else if(i<cur)cur--;
}
function refresh(){
  $("n").textContent=tracks.length?(cur>=0?"FAIXA "+String(cur+1).padStart(2,"0")+" / "+tracks.length:tracks.length+" FAIXAS"):"FAIXA --";
  if(!tracks.length)$("t").textContent="Carregue suas músicas";
  render();
}
$("ov1").onclick=function(){
  if(sel<0||sel>=tracks.length)return closeMenu();
  stopIf(false,sel);URL.revokeObjectURL(tracks[sel].url);tracks.splice(sel,1);sel=-1;closeMenu();refresh();
};
$("ovall").onclick=function(){
  stopIf(true,0);tracks.forEach(function(t){URL.revokeObjectURL(t.url)});tracks=[];sel=-1;closeMenu();refresh();
};
$("ovc").onclick=closeMenu;
$("ov").onclick=function(e){if(e.target===this)closeMenu()};
function play(i){
  if(i<0||i>=tracks.length){$("t").textContent="Faixa não encontrada";return}
  setup();if(ctx.state==="suspended")ctx.resume();
  cur=i;au.src=tracks[i].url;
  var pr=au.play();if(pr&&pr.catch)pr.catch(function(){$("n").textContent="TOQUE EM ⏯ PARA TOCAR"});
  $("n").textContent="FAIXA "+String(i+1).padStart(2,"0")+" / "+tracks.length;
  $("t").textContent=tracks[i].name;render();
}
$("file").onchange=function(e){
  var fs=Array.prototype.slice.call(e.target.files);
  if(!fs.length)return;
  fs.forEach(function(f){tracks.push({name:f.name.replace(/\.[^.]+$/,""),url:URL.createObjectURL(f)})});
  $("n").textContent=tracks.length+" FAIXAS";
  if(cur<0)$("t").textContent="Digite o número e toque";
  render();
};
$("go").onclick=function(){var v=parseInt($("num").value,10);if(v)play(v-1);$("num").blur()};
$("num").addEventListener("keydown",function(e){if(e.key==="Enter")$("go").click()});
$("pp").onclick=function(){setup();if(ctx.state==="suspended")ctx.resume();if(au.paused&&au.src)au.play();else au.pause()};
$("next").onclick=function(){if(tracks.length)play((cur+1)%tracks.length)};
$("prev").onclick=function(){if(tracks.length)play((cur-1+tracks.length)%tracks.length)};
au.onended=function(){$("next").click()};
au.ontimeupdate=function(){if(au.duration)$("p").style.width=(au.currentTime/au.duration*100)+"%"};
})();
</script>
</body>
</html>
